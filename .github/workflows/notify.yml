name: 식단 알림 발송

# 자동 스케줄 없이 수동 실행만 지원한다.
# GitHub Actions의 schedule은 지연·유실이 잦아 08:20 정시 발송을 지키지 못했다.
#   2026-08-27: 08:20 유실 → 수동 발송 → 13:31에 뒤늦게 실행돼 중복 발송
#   2026-08-28: 08:20 또 유실
# 정시성이 필요하면 cron을 되살리지 말고, 외부 스케줄러에서 이 워크플로를
# workflow_dispatch로 호출하는 쪽을 검토할 것.
on:
  workflow_dispatch:

jobs:
  notify:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: 식단 알림 발송
        env:
          MM_WEBHOOK_URL: ${{ secrets.MM_WEBHOOK_URL }}
        run: node scripts/notify.js
