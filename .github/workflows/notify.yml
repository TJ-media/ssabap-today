name: 식단 알림 발송

on:
  schedule:
    # 평일 오전 08:20 KST = UTC 전날 23:20 (일~목)
    - cron: '20 23 * * 0-4'
  workflow_dispatch:

jobs:
  notify:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: 식단 알림 발송
        env:
          MM_WEBHOOK_URL: ${{ secrets.MM_WEBHOOK_URL }}
          # 자동 알림을 건너뛸 KST 날짜(쉼표 구분). 이미 사람이 직접 발송한 날에 적어
          # 중복 발송을 막는다. 날짜가 지나면 저절로 무의미해지므로 되돌릴 필요 없다.
          #   2026-08-27: 스케줄 실행이 누락돼 수동 발송함
          # 수동 실행(workflow_dispatch)은 의도적인 발송이므로 목록을 무시한다.
          NOTIFY_SKIP_DATES: ${{ github.event_name == 'schedule' && '2026-08-27' || '' }}
        run: node scripts/notify.js
