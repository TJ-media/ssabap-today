name: 일회성 공지 발송

# 10/19 10층 공존 미운영 공지용. 발송 후 삭제한다.
on:
  push:
    branches: [claude/nice-goodall-8jinxn]
    paths: [.github/workflows/announce-once.yml]

jobs:
  announce:
    runs-on: ubuntu-latest
    steps:
      - name: 공지 발송
        env:
          MM_WEBHOOK_URL: ${{ secrets.MM_WEBHOOK_URL }}
        run: |
          node -e '
          const text = [
            "@all",
            "",
            "# [공지] 10/19(월) 10층 공존 미운영 안내",
            "##### 10/19(오늘) 10층 공존이 미운영되어 재공지 드립니다. 갑작스러운 변경 양해 부탁드립니다.",
          ].join("\n")
          const urls = (process.env.MM_WEBHOOK_URL ?? "").split(",").map(u => u.trim()).filter(Boolean)
          if (!urls.length) throw new Error("MM_WEBHOOK_URL이 비어 있습니다")
          ;(async () => {
            const failures = []
            for (const url of urls) {
              const res = await fetch(url, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ text }),
              }).catch(e => ({ ok: false, status: e.message }))
              if (res.ok) console.log(`✓ 발송: ...${url.slice(-8)}`)
              else failures.push(`...${url.slice(-8)}: ${res.status}`)
            }
            console.log(`대상 ${urls.length}곳, 실패 ${failures.length}곳`)
            if (failures.length) { console.error(failures.join(", ")); process.exit(1) }
          })()
          '
